# ============================================================================
# .qmake.conf —— qmake 在处理 .pro 之前读取的工程级配置
#   位置要求：与 .pro 同级（qmake 会从 .pro 所在目录向上查找该文件）
#
# 【修改理由】
# 现象：Debug 构建时 qmake 直接失败，报
#   Project ERROR: msvc-version.conf loaded but QMAKE_MSC_VER isn't set
#
# 根因：仓库根目录的 build/ 同时被 Windows-MSVC 构建和 WSL/aarch64 交叉构建使用，
#       两者会互相覆盖同目录下的 .qmake.stash（qmake 的编译器探测缓存）。
#       Qt 5.9.9 的 win32-msvc mkspec 自身不定义 QMAKE_MSC_VER，
#       mkspecs/features/toolchain.prf 只有在“缓存为空”时才调用
#       cl -nologo -E macros.cpp 探测编译器版本；当缓存由别的工具链（如 aarch64-gcc）
#       写入时，该探测被跳过，QMAKE_MSC_VER 保持为空，于是
#       mkspecs/common/msvc-version.conf 第 11 行的 error() 被触发。
#       该错误发生在 .pro 被求值之前（实测 .pro 里的 message()/error() 都不会执行），
#       因此无法在 .pro 中修复，只能在更早的 .qmake.conf 阶段兜底。
#
# 【逻辑梳理】
# 1. 仅当 CONFIG 含 win32 与 msvc（MSVC 工具链）且 QMAKE_MSC_VER 仍为空时进入：
#    缓存正常（已含 MSVC 版本信息）时不进入，Linux/GCC 交叉构建也不进入。
# 2. 用当前 PATH 上的 cl 预处理 Qt 自带的探测文件 macros.cpp，其输出本身就是
#    “QMAKE_MSC_VER = 1900” 形式的 qmake 赋值语句，逐行 eval 即可；
#    版本号始终来自实际编译器，VS2015 / VS2022 等不同工具链都能得到各自正确的结果。
# 3. cl 不存在或执行失败（退出码非 0）时不做任何处理，保持 qmake 原有行为。
# ============================================================================

win32:msvc:isEmpty(QMAKE_MSC_VER) {
    _LW_MSC_MACROS = $$system("cl -nologo -E $$system_quote($$[QT_INSTALL_ARCHDATA]/mkspecs/features/data/macros.cpp) <NUL 2>NUL", lines, _LW_MSC_EC)
    equals(_LW_MSC_EC, 0) {
        for (_LW_MSC_LINE, _LW_MSC_MACROS): eval($$_LW_MSC_LINE)
    }
}
